services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-db:
    image: postgres:16
    container_name: order-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderdb
    ports:
     - "5435:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16
    container_name: payment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paymentdb
    ports:
      - "5434:5432"
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paymentdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: ..
      dockerfile: AP_assik1/payment-service/Dockerfile
    container_name: payment-service
    restart: unless-stopped
    environment:
      PAYMENT_DB_URL: postgres://postgres:postgres@payment-db:5432/paymentdb?sslmode=disable
      PAYMENT_SERVICE_PORT: "8081"
      PAYMENT_GRPC_ADDR: 0.0.0.0
      PAYMENT_GRPC_PORT: "50051"
      PAYMENT_MIGRATION_PATH: /app/migrations/001_create_payments_table.sql
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
    ports:
      - "8081:8081"
      - "50051:50051"
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: ..
      dockerfile: AP_assik1/order-service/Dockerfile
    container_name: order-service
    restart: unless-stopped
    environment:
      ORDER_DB_URL: postgres://postgres:postgres@order-db:5432/orderdb?sslmode=disable
      ORDER_SERVICE_PORT: "8080"
      ORDER_GRPC_PORT: "50052"
      ORDER_MIGRATION_PATH: /app/migrations/001_create_payments_table.sql
      PAYMENT_SERVICE_GRPC_ADDRESS: payment-service:50051
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      ORDER_CACHE_TTL: ${ORDER_CACHE_TTL:-5m}
      ORDER_RATE_LIMIT_ENABLED: ${ORDER_RATE_LIMIT_ENABLED:-true}
      ORDER_RATE_LIMIT_REQUESTS: ${ORDER_RATE_LIMIT_REQUESTS:-10}
      ORDER_RATE_LIMIT_WINDOW: ${ORDER_RATE_LIMIT_WINDOW:-1m}
    ports:
      - "8080:8080"
      - "50052:50052"
    depends_on:
      order-db:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: ..
      dockerfile: AP_assik1/notification-service/Dockerfile
    container_name: notification-service
    restart: unless-stopped
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      NOTIFICATION_IDEMPOTENCY_TTL: ${NOTIFICATION_IDEMPOTENCY_TTL:-24h}
      NOTIFICATION_RETRY_COUNT: ${NOTIFICATION_RETRY_COUNT:-4}
      NOTIFICATION_RETRY_BASE_DELAY: ${NOTIFICATION_RETRY_BASE_DELAY:-2s}
      PROVIDER_MODE: ${PROVIDER_MODE:-SIMULATED}
      SIMULATED_PROVIDER_LATENCY: ${SIMULATED_PROVIDER_LATENCY:-750ms}
      SIMULATED_PROVIDER_FAILURE_RATE: ${SIMULATED_PROVIDER_FAILURE_RATE:-0.25}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10s}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  rabbitmq_data:
  redis_data:
  order_db_data:
  payment_db_data:
